[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools","wheel","toml"] 

[project]
name = "quoridor"
dynamic = ["version"]
description = "Quoridor game"
authors = [
  {name = "Lucas Danglard", email = "lucas.danglard@etu.u-bordeaux.fr"},
  {name = "Lucy-Jean Curtis", email = "lucy-jean.curtis@etu.u-bordeaux.fr"},
  {name = "Mohamad Almousa", email = "mohamad.almousa@etu.u-bordeaux.fr"},
  {name = "Bastien Rocher", email = "bastien.rocher@u-bordeaux.fr"},
  {name = "Zhaoyuan Song", email = "zhaoyuan.song@etu.u-bordeaux.fr"},
]
license = {text = "BSD-2-clauses"}
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  'importlib-metadata; python_version<"3.7"', # Metadata access
  "pytest", # Testing framework
  "coverage", # Coverage
  "pytest-cov", # Code coverage plugin
  "argparse", # Argument parsing
  "PyGObject", # GTK library
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.pytest.ini_options]
addopts = [ # Add options for pytest
  "--cov=myproject",
  "--cov-report=html",
  "--cov-report=term",
  "--cov-branch",
]



[tool.setuptools]
packages = ["src"]

[project.scripts]
quoridor = "src.main:main"
